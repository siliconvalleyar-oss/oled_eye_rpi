# =============================================================================
# EyePet - Configuración general del ojo de mascota (config/config.cfg)
# -----------------------------------------------------------------------------
# Formato: "clave = valor" (las líneas que empiezan con '#' son comentarios).
# Este archivo controla el comportamiento y la animación del ojo.
# La configuración de HARDWARE (protocolo I2C/SPI, pines) está en hardware.cfg.
# =============================================================================

[General]
# -----------------------------------------------------------------------------
# Modo inicial del ojo (también seleccionable con --mode 0..7):
#   0 = Normal     (ojo abierto explorando al frente)
#   1 = Tracking   (sigue un objetivo simulado en movimiento)
#   2 = Happy      (alegría: cejas arqueadas, pupila dilatada)
#   3 = Surprised  (sorpresa: cejas elevadas, pupila pequeña)
#   4 = Angry      (enfado: cejas fruncidas)
#   5 = Sleepy     (sueño: párpado medio cerrado)
#   6 = Sleep      (dormido: ojo cerrado con temblores ocasionales)
#   7 = Saccades   (movimientos sacádicos rápidos)
# -----------------------------------------------------------------------------
mode = 0

# Estilo (versión) del ojo (también seleccionable con --style 0..3):
#   0 = Classic  (clásico redondeado, pupila circular, un brillo)
#   1 = Anime    (elipse grande a pantalla completa, pupila amplia, 2 brillos)
#   2 = Feline   (felino: iris marcado, pupila vertical alargada)
#   3 = Robot    (visor rectangular, pupila cuadrada con retícula)
# -----------------------------------------------------------------------------
style = 0

# Velocidad de la animación:
#   frame_rate      : fotogramas por segundo objetivo (10..60).
#   frame_delay_ms  : si > 0, fuerza el delay entre fotogramas (ms) e ignora
#                     frame_rate. Dejar en 0 para usar frame_rate.
frame_rate = 30
frame_delay_ms = 0

[Parpadeo]
# Intervalos (ms) entre parpadeos espontáneos.
blink_min_ms = 1500
blink_max_ms = 4500

# Duración (ms) de cada fase del parpadeo:
blink_close_ms        = 90     # tiempo de cerrar el párpado
blink_open_ms         = 90     # tiempo de abrir el párpado
blink_closed_hold_ms  = 100    # tiempo con el ojo cerrado

[Movimiento]
# Rango (en píxeles) que puede recorrer la pupila alrededor del centro del ojo.
# Cuanto mayor el rango, mayores los desplazamientos del iris.
move_range_x = 14
move_range_y = 8

[Geometria del ojo]
# Centro del ojo sobre la pantalla de 128x64 píxeles (el ojo ocupa toda la
# pantalla con sclera_r = 30).
eye_center_x = 64
eye_center_y = 32

# Radios (píxeles):
sclera_r = 30     # blanco del ojo (casi toda la altura: 2..62)
iris_r   = 16     # iris (zona circular)
pupil_r  = 6      # pupila (centro negro)

[Expresiones]
# Dibujar cejas (true/false).
draw_eyebrows = true

# Dilatación de la pupila por expresión (multiplicador implícito en cada modo).
# Modo Happy y Saccades usan pupil_r; Surprised reduce la pupila; Angry la
# mantiene. Se ajusta en el motor según la expresión activa.

[Brillo / Reflejo]
# Pequeño punto blanco sobre el iris para dar realismo (solo se dibuja si el
# ojo está suficientemente abierto).
glint = true
glint_dx = -6     # offset X del brillo respecto al centro del iris
glint_dy = -5     # offset Y del brillo
glint_r  = 2      # radio del punto de brillo (1..3; los estilos usan su patrón)

[Diagnostico]
# Muestra información de depuración cada 30 fotogramas por consola.
debug = false