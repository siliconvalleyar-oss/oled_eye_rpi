# =============================================================================
# EyePet - Configuración de hardware del display OLED (config/hardware.cfg)
# -----------------------------------------------------------------------------
# Formato: "clave = valor" (las líneas que empiezan con '#' son comentarios).
# Selecciona el protocolo y los pines/dispositivos de la pantalla SSD1306.
# =============================================================================

[Protocolo]
# Protocolo del display: "i2c" (por defecto) o "spi".
#
#   i2c : acceso directo por /dev/i2c-N (ioctl). Funciona en todas las
#         Raspberry Pi, incluidas Pi 5 / Compute Module 5 (chip RP1), donde la
#         librería bcm2835 NO soporta I2C.
#   spi : acceso por /dev/spidevX.Y (4 hilos: SCK, MOSI, DC, RST). Requiere
#         habilitar SPI en /boot/config.txt (dtparam=spi=on).
protocol = i2c

[I2C]
# Dispositivo del adaptador I2C del kernel.
i2c_device = /dev/i2c-1
# Dirección I2C del display (0x3C por defecto; algunos módulos usan 0x3D).
i2c_address = 0x3C

[SPI]
# Dispositivo del bus SPI (controlador 0, chip select 0).
spi_device = /dev/spidev0.0
# Velocidad máxima del bus en Hz.
spi_speed = 1000000
# Pines GPIO (numeración BCM) para el modo SPI de 4 hilos:
spi_dc_pin  = 24    # DC: distingue comando (bajo) de dato (alto).
spi_rst_pin = 25    # RESET: pulso bajo para reinicar el display (0 = sin reset).
spi_reset_active_high = false