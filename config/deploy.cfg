# =============================================================================
# config/deploy.cfg - Configuración de despliegue y compilación remota
# -----------------------------------------------------------------------------
# Este archivo NO contiene la contraseña. La contraseña se lee de la variable
# de entorno SSHPASS (p.ej. `export SSHPASS="..."` o `read -s SSHPASS`) y se usa
# junto con `sshpass -e`. Así evitamos exponer credenciales en el repositorio.
# =============================================================================

# --- Host remoto (Raspberry Pi) ----------------------------------------------
REMOTE_USER=pi
REMOTE_HOST=rpi2w.local

# --- Ruta local del proyecto en la Raspberry Pi ------------------------------
# Comandos que se ejecutarán tras ssh: cd <REMOTE_DIR> && git pull && ...
REMOTE_DIR=/home/pi/src/basic

# --- Rama a desplegar en el build remoto -------------------------------------
REMOTE_BRANCH=crossover
